[package]
name = "dolos-cli"
version = "0.1.0"
edition = "2024"
description = "The command line interface of Dolos, a source code plagiarism detection tool."
repository = "https://github.com/dodona-edu/dolos-rs"
license = "MIT"

[[bin]]
name = "dolos"
path = "src/main.rs"

[dependencies]
dolos-lib = { path = "../dolos-lib", features = ["all-languages"] }
clap = { version = "4.6.1", features = ["derive"] }
terminal_size = "0.4.4"
csv = "1.4.0"
serde = { version = "1.0.228", features = ["derive"] }
tree-sitter-grammars = { path = "../tree-sitter-grammars" }
axum = "0.8.9"
tokio = { version = "1.53.1", features = ["rt", "net"] }
tower-http = { version = "0.7.1", features = ["fs"] }
open = "5.4.3"
anyhow = "1.0.104"
anstream = "1.0.0"
anstyle = "1.0.14"

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["macros", "rt"] }
tower = { version = "0.5.3", features = ["util"] }
rstest = "0.28.0"
