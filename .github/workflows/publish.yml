name: Publish WASM package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "npm version of @dodona/dolos-core, 2.0.0 or higher"
        required: true
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:

  publish:
    name: "publish 📦"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check the version
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || [ "${VERSION%%.*}" -lt 2 ]; then
            echo "::error::'$VERSION' is not a version of the form 2.0.0 or higher"
            exit 1
          fi
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable && rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: dolos-core/tests-typescript/package-lock.json
      - run: wasm-pack build dolos-core --target nodejs --out-dir pkg-node --release -- --features wasm
      - working-directory: dolos-core/tests-typescript
        run: npm ci && npm run typecheck && npm test
      - run: wasm-pack build dolos-core --target web --scope dodona --release -- --features wasm
      - working-directory: dolos-core/pkg
        run: npm version --no-git-tag-version "$VERSION"
      - working-directory: dolos-core/pkg
        run: npm publish --access public
