name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:

  build:
    name: "build 🔧"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v7
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --verbose --features all-languages

  lint:
    name: "lint 📏"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --features all-languages,wasm --all-targets -- -D warnings

  test:
    name: "test 🧪"
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        toolchain:
          - stable
          - beta
          - nightly
    steps:
      - uses: actions/checkout@v7
      - run: rustup update ${{ matrix.toolchain }} && rustup default ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --verbose --features all-languages

  wasm:
    name: "wasm 🕸"
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup update stable && rustup default stable
      - run: rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack
      - run: cargo test -p dolos-core --features wasm
      - run: cargo clippy --target wasm32-unknown-unknown -p dolos-core --features wasm -- -D warnings
      - run: wasm-pack build dolos-core --target bundler --release -- --features wasm
      - run: wasm-pack build dolos-core --target nodejs --out-dir pkg-node --release -- --features wasm
      # Node 24 or later: `test.ts` runs as TypeScript and uses `using`.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dolos-core/tests-typescript/package-lock.json
      - run: npm ci
        working-directory: dolos-core/tests-typescript
      - run: npm run typecheck
        working-directory: dolos-core/tests-typescript
      - run: npm test
        working-directory: dolos-core/tests-typescript
