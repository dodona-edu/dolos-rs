[package]
name = "dolos-core"
version = "0.1.0"
edition = "2024"
description = "The computational core of Dolos. It finds maximal matches between fingerprint sequences and derives pairwise similarity metrics."
repository = "https://github.com/dodona-edu/dolos-rs"
license = "MIT"

[lib]
# cdylib for the wasm-pack build, rlib so dolos-lib keeps linking it normally.
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["dep:serde", "dep:serde-wasm-bindgen", "dep:tsify", "dep:wasm-bindgen"]

[dependencies]
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde-wasm-bindgen = { version = "0.6.5", optional = true }
tsify = { version = "0.5.8", default-features = false, features = ["js"], optional = true }
wasm-bindgen = { version = "0.2.128", optional = true }

[dev-dependencies]
rand = "0.10.1"
